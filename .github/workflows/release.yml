name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: |
          for f in $(find . -name '*.php' -not -path './.git/*'); do php -l "$f" >/dev/null || exit 1; done
          echo "LINT OK: todos los PHP sin errores de sintaxis"

  package-deb:
    name: Paquete .deb
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Versión desde la etiqueta
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Construir .deb
        run: ./scripts/build-deb.sh "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-android:
    name: APK + AAB firmados
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Keystore (se usa el secreto ANDROID_KEYSTORE_BASE64 si existe; si no, se genera)
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "KEYSTORE_FILE=$PWD/keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore keystore.jks \
              -storepass socialairsoft -keypass socialairsoft -alias socialairsoft \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Social Airsoft, OU=CI, O=SocialAirsoft, L=Madrid, C=ES" >/dev/null 2>&1
            echo "KEYSTORE_FILE=$PWD/keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=socialairsoft" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=socialairsoft" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=socialairsoft" >> "$GITHUB_ENV"
          fi
      - name: Versión de la app
        id: v
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "versionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "versionName=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi
          echo "versionCode=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build release (APK + AAB)
        working-directory: android
        run: gradle assembleRelease bundleRelease -PversionName=${{ steps.v.outputs.versionName }} -PversionCode=${{ steps.v.outputs.versionCode }}
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
      - name: Reunir artefactos
        run: |
          mkdir -p dist
          VN=${{ steps.v.outputs.versionName }}
          cp android/app/build/outputs/apk/release/app-release.apk "dist/socialairsoft-${VN}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/socialairsoft-${VN}.aab"
          cp keystore.jks "dist/socialairsoft-${VN}-keystore-backup.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/

  release:
    name: Publicar release en GitHub
    runs-on: ubuntu-latest
    needs: [package-deb, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/deb-package/*.deb
            artifacts/android-release/*.apk
            artifacts/android-release/*.aab
          generate_release_notes: true